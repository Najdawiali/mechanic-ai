services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mechanic-ai-db
    environment:
      POSTGRES_USER: mechanic
      POSTGRES_PASSWORD: mechanic      # local development only
      POSTGRES_DB: mechanic_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechanic -d mechanic_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
