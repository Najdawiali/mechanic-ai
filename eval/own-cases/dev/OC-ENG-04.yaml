info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    P0128 (coolant temperature below thermostat regulating temperature) with a low gauge and weak heater most likely
    means a thermostat stuck open; the coolant temperature sensor or its circuit can also cause it. Compare ECT
    live data with a real temperature reading and watch warm-up time.
  likely_causes_ranked:
  - Thermostat stuck open
  - Faulty engine coolant temperature sensor
  - Sensor wiring/connector fault
  - Cooling fan running constantly
  diagnostic_steps:
  - Watch ECT live data during warm-up
  - Compare with an infrared thermometer at the thermostat housing/hoses
  - Check whether the radiator hose gets hot too early
  - Check the fan is not running all the time
  - Replace the thermostat if confirmed stuck open
  must_mention:
  - Thermostat stuck open is the most likely cause
  - Compare ECT data with actual temperature
  - Check fan operation
  must_not_claim:
  - That the water pump is the cause
