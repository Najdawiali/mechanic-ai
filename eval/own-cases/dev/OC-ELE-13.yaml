reference:
  summary: >-
    Head units that reboot repeatedly are often software-related (update available) but can also be power/ground
    interruptions or a faulty unit. Check for a software update/campaign by VIN, check power and ground at the unit,
    and remove USB devices/phones that may trigger crashes.
  likely_causes_ranked:
  - Infotainment software issue (update available)
  - Faulty USB device/phone causing crashes
  - Intermittent power/ground to the head unit
  - Internal head unit fault
  diagnostic_steps:
  - Check for software updates/campaigns by VIN
  - Disconnect USB devices and phone pairing and retest
  - Check power/ground at the unit during a reboot
  - Scan for codes in the multimedia module
  must_mention:
  - Check for software update by VIN
  - Test without USB/phone connected
  - Check power and ground to the unit
  must_not_claim:
  - That the unit must be replaced immediately
