reference:
  summary: >-
    Problems that started after an OBD-port tracker was installed point to the device disturbing the CAN bus or
    draining power. Remove the device and retest; check DLC pins and wiring.
  likely_causes_ranked:
  - Aftermarket OBD device disturbing CAN communication
  - Device draining the battery
  - Damaged DLC pins/wiring during install
  diagnostic_steps:
  - Remove the tracker and clear codes
  - Retest starting and communication
  - Inspect DLC pins and wiring
  - Check battery state of charge and parasitic draw with the device fitted
  must_mention:
  - Remove the OBD tracker first
  - Aftermarket OBD devices can disturb CAN and drain the battery
  must_not_claim:
  - That vehicle modules are faulty without removing the device
