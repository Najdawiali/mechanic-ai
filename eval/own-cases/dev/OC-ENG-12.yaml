info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    P0507 (idle higher than expected) after a throttle body cleaning often needs the idle/throttle relearn procedure;
    otherwise look for vacuum leaks or a sticking throttle. Perform the throttle/idle relearn per OEM, check for
    vacuum leaks, and check the throttle plate and connector.
  likely_causes_ranked:
  - Idle/throttle position not relearned after cleaning
  - Vacuum leak
  - Throttle body sticking or damaged plate
  - Faulty throttle body/sensor
  diagnostic_steps:
  - Perform the idle/throttle relearn procedure per OEM
  - Check for vacuum leaks
  - Inspect throttle plate and connector
  - Check live data for throttle position and idle target
  must_mention:
  - Relearn idle/throttle after cleaning
  - Check vacuum leaks
  - P0507 = idle higher than expected
  must_not_claim:
  - That the throttle body must be replaced without relearn
