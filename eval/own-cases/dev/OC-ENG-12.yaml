user_question: >-
  کیا سیراٹو 2019، آئیڈل پر RPM زیادہ رہتا ہے اور P0507 کوڈ آ رہا ہے۔ تھروٹل باڈی صاف کی تھی ایک ہفتہ پہلے۔ اب کیا
