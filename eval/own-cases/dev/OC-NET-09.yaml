reference:
  summary: >-
    Warnings after a battery change can be from voltage dips or the battery reconnect needing relearn procedures,
    but U0073 (communication bus A off) should be verified: check battery terminals and grounds, clear codes, and
    see if it returns before deeper network tests.
  likely_causes_ranked:
  - Low voltage events during battery change
  - Loose battery terminal or ground
  - Required relearn/initialization after battery change
  - Real CAN bus fault
  diagnostic_steps:
  - Check battery terminals, grounds and voltage
  - Clear codes and drive; recheck
  - Perform OEM initialization procedures (windows, steering angle etc.) if required
  - If U0073 returns, test the bus
  must_mention:
  - Check terminals/grounds after battery change
  - Clear codes and recheck before deep diagnosis
  must_not_claim:
  - That a module must be replaced
