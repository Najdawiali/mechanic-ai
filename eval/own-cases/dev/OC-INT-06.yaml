user_question: >-
  کیمری 2017، لمبے سفر پر ایک گھنٹے بعد اے سی گرم ہوا دینے لگتا ہے، پھر تھوڑی دیر رکنے کے بعد دوبارہ ٹھنڈا ہو جاتا
  ہے۔ گیس ٹھیک ہے۔ کیا وجہ ہے؟
info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    Cooling that fades after long running and recovers after a stop suggests the evaporator freezing (faulty evaporator
    temperature sensor, moisture in the system) or a compressor clutch overheating/gap issue. Watch evaporator temperature
    data and clutch operation when it fails, check for icing and airflow.
  likely_causes_ranked:
  - Evaporator icing (evaporator temp sensor/thermistor fault)
  - Moisture in the refrigerant system
  - Compressor clutch air gap/overheating
  - Blocked cabin filter reducing airflow
  diagnostic_steps:
  - When it fails, check whether airflow drops (icing) or air just gets warm
  - Read evaporator temperature data
  - Check compressor clutch engagement and air gap
  - Check cabin filter
  - Evacuate/recharge if moisture is suspected
  must_mention:
  - Evaporator freezing is a likely cause
  - Check evaporator temperature sensor
  - Check compressor clutch when it fails
  must_not_claim:
  - That adding refrigerant will fix it
