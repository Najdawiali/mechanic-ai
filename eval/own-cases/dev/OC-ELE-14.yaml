user_question: >-
  ہونڈا سوک 2018 میں جب اے سی آن کرتے ہیں تو انجن کا کولنگ فین نہیں چلتا اور اے سی ٹھنڈا نہیں کرتا ٹریفک میں۔ ہائی
  وے پر ٹھیک ٹھنڈا کرتا ہے۔ کیا چیک کروں؟
info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    Good cooling at highway speed but poor cooling in traffic with no fan operation points to the condenser/radiator
    fan circuit: fan motor, relay, fuse, or its command. Check the fan with the AC on, test the relay and supply,
    and command the fan with a scan tool.
  likely_causes_ranked:
  - Fan motor failed
  - Fan relay or fuse
  - Wiring/connector at the fan
  - Fan control command (pressure sensor input or module output)
  diagnostic_steps:
  - With AC on, check whether the fan runs
  - Command the fan with a scan tool if supported
  - Test relay, fuse and supply/ground at the fan motor
  - Apply power directly to the fan to test the motor
  - Check the AC pressure sensor input data
  must_mention:
  - Poor cooling only at low speed points to the condenser fan
  - Test fan relay/fuse and the motor
  - Command the fan with a scan tool
  must_not_claim:
  - That the compressor is faulty
