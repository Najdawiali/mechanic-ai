info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    P0715 (input/turbine speed sensor A circuit) can cause harsh shifts and limp mode. Check the sensor connector
    and wiring, sensor signal in live data, and fluid level/condition before replacing parts.
  likely_causes_ranked:
  - Input/turbine speed sensor fault
  - Wiring/connector fault at the transmission
  - Low/burnt transmission fluid
  - TCM fault (less likely)
  diagnostic_steps:
  - Check fluid level and condition per OEM procedure
  - Inspect the sensor connector and harness
  - Watch input speed data while driving
  - Test sensor circuit with the wiring diagram
  - Check TSBs/software updates by VIN
  must_mention:
  - P0715 = input/turbine speed sensor circuit
  - Limp mode explains stuck in one gear
  - Check wiring/connector and fluid
  must_not_claim:
  - That the transmission must be rebuilt
