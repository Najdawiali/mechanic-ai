user_question: >-
  شیورلیٹ مالیبو 2018، کبھی کبھی ڈور لاک، لائٹس اور وائپر کام نہیں کرتے اور اسکین میں U0140 آتا ہے۔ BCM خراب ہے؟
info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    U0140 (lost communication with body control module) with intermittent body functions points to BCM power/ground
    or connector issues, or CAN wiring to the BCM, before condemning the BCM.
  likely_causes_ranked:
  - BCM power/ground or fuse issue
  - Loose/corroded BCM connector
  - CAN wiring fault to the BCM
  - BCM internal fault or software
  diagnostic_steps:
  - Check BCM fuses, powers and grounds
  - Inspect BCM connectors for corrosion/water
  - Check CAN wiring to the BCM
  - Check for software updates/TSBs
  - Replace/program BCM only if confirmed
  must_mention:
  - U0140 = lost communication with BCM
  - Check BCM power/ground and connectors first
  must_not_claim:
  - That the BCM must be replaced immediately
