user_question: >-
  مرسيدس C200 2018 مروحة المكيف الداخلية ما تشتغل، وقالوا لي إنها تشتغل على LIN. كيف أفحص خط LIN بالجهاز؟
info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    On a LIN-controlled blower, check the blower's power and ground first, then the LIN line: it idles near battery
    voltage when quiet and pulls toward ground during messages, best seen on a scope. Check the controlling module's
    codes.
  likely_causes_ranked:
  - Blower motor/regulator failure
  - Missing power or ground at the blower
  - LIN line open/short to ground or battery
  - Climate control module fault
  diagnostic_steps:
  - Read climate module codes
  - Check power and ground at the blower module
  - Check the LIN line with a scope (or meter for a stuck level)
  - Check LIN wiring for open/short
  - Test the blower/regulator
  must_mention:
  - Check power and ground before LIN
  - LIN idles near battery voltage and pulses toward ground; scope preferred
  - Read module codes
  must_not_claim:
  - Exact Mercedes pin numbers or wire colours without a source
