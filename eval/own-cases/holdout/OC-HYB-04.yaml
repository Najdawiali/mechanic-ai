user_question: >-
  کیا نیرو ہائبرڈ 2019، صبح گاڑی READY نہیں ہوتی، ڈیش بورڈ مدھم ہے۔ لوگ کہتے ہیں ہائبرڈ بیٹری خراب ہے۔ پہلے کیا
  چیک کروں؟
info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    If the dash is dim and the car won't go READY, the 12V (low-voltage) system is the first suspect, not the hybrid
    battery. Check/charge the 12V battery (some Niro models have a 12V battery reset button), then scan for codes.
  likely_causes_ranked:
  - Discharged 12V battery
  - Parasitic drain
  - DC-DC converter not charging the 12V
  - Hybrid system fault (less likely with dim dash)
  diagnostic_steps:
  - Test and charge the 12V battery
  - Use the 12V battery reset function if the model has it (see owner's manual)
  - Scan for codes
  - Check DC-DC charging once READY
  must_mention:
  - 'Dim dash: check the 12V battery first'
  - Not the hybrid battery as first suspect
  must_not_claim:
  - That the hybrid battery must be replaced
