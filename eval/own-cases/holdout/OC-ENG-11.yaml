reference:
  summary: >-
    P1326 is a manufacturer-specific code; on some Hyundai/Kia Theta II engines it is linked to the knock sensor
    detection system (KSDS) that warns of possible connecting-rod bearing wear. Confirm the description on the scan
    tool, check for campaigns/recalls/warranty extension by VIN, check oil level, and limit driving because bearing
    failure can cause engine seizure.
  likely_causes_ranked:
  - Connecting rod bearing wear detected by the knock sensor logic
  - Low oil level/oil starvation
  - Knock sensor/system issue
  diagnostic_steps:
  - Confirm the code description on the scan tool
  - Check oil level and condition
  - Check open campaigns/recalls/extended warranty by VIN with the dealer
  - Limit driving; have the engine inspected (bearing noise check)
  must_mention:
  - 'P1326 is manufacturer-specific: confirm the description'
  - Check campaigns/recalls/warranty by VIN
  - Limit driving due to engine damage risk
  must_not_claim:
  - That it is a minor code and safe to keep driving normally
  - That P1326 is a generic SAE code with a universal meaning
