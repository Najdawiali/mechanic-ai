  engine: 3.5L V6
  powertrain: ice
  market: GCC
  vin: null
dtcs: []
user_question: >-
  2018 Explorer, the fuel gauge stays on empty even after filling up, and the low fuel light is on. No other warnings.
  Customer asks if he needs a new fuel pump.
info_completeness: complete
expected_behavior: answer
reference:
  summary: >-
    A gauge stuck at empty with a full tank is usually the fuel level sender (or its circuit), not the pump, since
    the engine runs normally. Read the fuel level PID with a scan tool, check codes, test the sender circuit and
    connector at the tank.
  likely_causes_ranked:
  - Faulty fuel level sender
  - Open circuit/connector at the fuel pump module
  - Instrument cluster or module reading the sender
  - Ground fault on the sender circuit
  diagnostic_steps:
  - Read fuel level input and codes with a scan tool
  - Check the connector at the fuel pump module for corrosion
  - Test the sender circuit for open/short using the wiring diagram
