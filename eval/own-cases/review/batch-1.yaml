  - Door lock actuator circuit fault (if interior switch also fails)
  diagnostic_steps:
  - Test door locking from the interior switch and the request button on the door handle
  - Remove aftermarket USB chargers/dashcams and retest
  - Scan the BCM/intelligent key unit for codes and check data/inputs
  - Inspect the receiver connector and power/ground; re-register keys only per OEM procedure
  must_mention:
