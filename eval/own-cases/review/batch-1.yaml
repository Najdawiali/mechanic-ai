  likely_causes_ranked:
  - Water-damaged rear blower control module/resistor or connector
  - Failed rear blower motor
  - Rear blower relay
  - Wiring/ground fault in the rear HVAC circuit
  diagnostic_steps:
  - Inspect rear blower motor and control module connectors for water/corrosion
  - With the rear blower commanded on, check supply and ground at the motor
  - Apply power directly to the motor to test it
  - Check the blower control module/resistor and relay; scan HVAC module for codes
  must_mention:
  - Water ingress/corrosion as a lead from the car-wash timing
  - Test power and ground at the blower motor
  - Check the blower control module/resistor
  must_not_claim:
  - That the HVAC control head must be replaced without testing
