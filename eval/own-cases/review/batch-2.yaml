  - Blown fuse/fusible link affecting ECM power
  - Poor ECM power/ground
  - Software issue
  diagnostic_steps:
  - Check all fuses/fusible links and the battery
  - Verify ECM power and ground circuits
  - Clear codes and see if P0606 returns
  - Check for software updates
  - Replace and program the ECM only if confirmed
  must_mention:
  - Check fuses, power and ground before replacing the ECM
  - Reverse polarity can damage fuses/ECM
  - ECM replacement needs programming
  must_not_claim:
  - That the ECM must be replaced without checking power and grounds
