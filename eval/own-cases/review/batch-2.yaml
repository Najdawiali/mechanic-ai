  - Air in the inverter cooling loop
  - Cooling fan issue
  diagnostic_steps:
  - Check the inverter coolant reservoir level
  - Check whether the inverter coolant is circulating (pump operation)
  - Check for leaks and bleed per OEM
  - Check TSBs/recalls by VIN
  must_mention:
  - Inverter has a separate cooling loop
  - Check the inverter coolant pump and level
  - Qualified HV technician for inverter work
  must_not_claim:
