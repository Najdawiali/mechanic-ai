  - Check ABS fuses, powers and grounds
  - Inspect harness in the repaired area for damage
  - Check CAN continuity/resistance and voltages
  - Scan again after repairs
  must_mention:
  - U0121 = lost communication with ABS module
  - Check connector, fuses and grounds of the ABS module
  - Inspect wiring in the collision area
  must_not_claim:
  - That the ABS module is definitely faulty
